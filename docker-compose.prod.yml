networks:
  web: {}   # public edge; only traefik + frontend join this

x-minio-env: &minio-env
  MINIO_ENDPOINT: ${MINIO_ENDPOINT}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET: ${MINIO_BUCKET}
  MINIO_SECURE: ${MINIO_SECURE}

x-redis-env: &redis-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SONG_CACHE_TTL_SECONDS: ${SONG_CACHE_TTL_SECONDS:-86400}
  REDIS_RESULT_STREAM: ${REDIS_RESULT_STREAM:-clankr:events:results}
  REDIS_VISIBILITY_TIMEOUT_MS: ${REDIS_VISIBILITY_TIMEOUT_MS:-3600000}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  traefik:
    logging: *default-logging
    image: traefik:v3.7.1
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # - --accesslog=true
      # - --accesslog.format=json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks: [web]
  frontend:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-ghcr.io/your-github-owner/clankr}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./services/frontend
      target: runner
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CHOKIDAR_USEPOLLING: "true"
    # remove host port publish:
    # ports: ["3000:3000"]
    expose: ["3000"]
    working_dir: /app
    command: ["npm","run","start"]
    env_file: ["${ENV_FILE:-.env}"]
    networks: [web, default]             # public via traefik + internal to talk to API
    labels:
      - traefik.enable=true
      - traefik.docker.network=clankr-prod_web
      - traefik.http.routers.frontend.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=le
      - traefik.http.services.frontend.loadbalancer.server.port=3000
      # optional hardening:
      - traefik.http.middlewares.hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true
      - traefik.http.routers.frontend.middlewares=hsts
  db:
    logging: *default-logging
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - "postgres"
      - "-c"
      - "log_timezone=UTC"                      # match your app’s UTC timestamps
      - "-c"
      - "log_min_messages=info"                 # show INFO and above
      - "-c"
      - "log_min_error_statement=info"
      - "-c"
      - "client_min_messages=notice"
      - "-c"
      - "log_line_prefix=%m %s:     clankr_db %u@%d app=%a [%p] "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 100s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio_init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        set -eu;
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    restart: "no"

  demucs:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-ghcr.io/your-github-owner/clankr}/demucs:${IMAGE_TAG:-latest}
    build: ./services/demucs
    restart: unless-stopped
    environment:
      <<: [*minio-env, *redis-env]
    depends_on:
      minio_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    working_dir: /app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 100s
      timeout: 3s
      retries: 30
      start_period: 20s


  whisper:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-ghcr.io/your-github-owner/clankr}/whisper:${IMAGE_TAG:-latest}
    build: ./services/whisper
    restart: unless-stopped
    environment:
      <<: [*minio-env, *redis-env]
    depends_on:
      minio_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    working_dir: /app
    env_file:
      - ${ENV_FILE:-.env}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 100s
      timeout: 3s
      retries: 30
      start_period: 20s

  # localai:
  #   image: localai/localai:latest-cpu
  #   ports: ["8080:8080"]
  #   environment:
  #     - API_KEY=secret
  #   volumes:
  #     - ./models:/models
  #   restart: unless-stopped
  classifier:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-ghcr.io/your-github-owner/clankr}/classifier:${IMAGE_TAG:-latest}
    build: ./services/classifier
    restart: unless-stopped
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 100s
      timeout: 3s
      retries: 30
      start_period: 20s
    environment:
      <<: [*minio-env, *redis-env]
      AI_BASE_URL: "http://ollama:11434"
      AI_MODEL: "qwen2.5:3b-instruct"   # or whatever LocalAI exposes
      AI_API_KEY: "secret"
    env_file:
      - ${ENV_FILE:-.env}

  acousti:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-ghcr.io/your-github-owner/clankr}/acousti:${IMAGE_TAG:-latest}
    build: ./services/acousti
    restart: unless-stopped
    environment:
      <<: [*minio-env, *redis-env]
    depends_on:
      minio_init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    working_dir: /app
    env_file:
      - ${ENV_FILE:-.env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 100s
      timeout: 3s
      retries: 30
      start_period: 20s
  orchestrator:
    logging: *default-logging
    image: ${IMAGE_PREFIX:-ghcr.io/your-github-owner/clankr}/orchestrator:${IMAGE_TAG:-latest}
    build: ./services/orchestrator
    depends_on:
      minio_init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*minio-env, *redis-env]
    working_dir: /app
    env_file:
      - ${ENV_FILE:-.env}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 100s
      timeout: 3s
      retries: 30
      start_period: 20s

  ollama:
    logging: *default-logging
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ./ollama:/root/.ollama
    restart: unless-stopped
        
volumes:
  pgdata:
  miniodata:
  redisdata:
