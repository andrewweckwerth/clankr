x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-minio-env: &minio-env
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-clankr}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me}
  MINIO_BUCKET: ${MINIO_BUCKET:-clankr-audio}
  MINIO_SECURE: "false"

services:


  db:
    logging: *default-logging
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - "postgres"
      - "-c"
      - "log_timezone=UTC"                      # match your app’s UTC timestamps
      - "-c"
      - "log_min_messages=info"                 # show INFO and above
      - "-c"
      - "log_min_error_statement=info"
      - "-c"
      - "client_min_messages=notice"
      - "-c"
      - "log_line_prefix=%m %s:     clankr_db %u@%d app=%a [%p] "
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost"]
      interval: 100s
      timeout: 5s
      retries: 5
      start_period: 20s


  frontend:
    logging: *default-logging
    build:
      context: ./frontend
      target: dev
    depends_on:
      orchestrator_api:
        condition: service_healthy
    restart: on-failure
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    working_dir: /app
    command: sh -c "npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ${ENV_FILE:-.env}

  demucs_api:
    logging: *default-logging
    build: ./demucs-api
    restart: on-failure
    volumes:
      - ./demucs-api:/app
    environment: *minio-env
    depends_on:
      minio_init:
        condition: service_completed_successfully
    working_dir: /app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 100s
      timeout: 3s
      retries: 30
      start_period: 20s


  whisper_api:
    logging: *default-logging
    build: ./whisper-api
    restart: on-failure
    volumes:
      - ./whisper-api:/app
    environment: *minio-env
    depends_on:
      minio_init:
        condition: service_completed_successfully
    working_dir: /app
    command: >
      uvicorn whisper_runner:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app
    env_file:
      - ${ENV_FILE:-.env}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 100s
      timeout: 3s
      retries: 30
      start_period: 20s


  classifier_api:
    logging: *default-logging
    build: ./classifier-api
    restart: on-failure
    volumes:
      - ./classifier-api:/app
    working_dir: /app
    command: >
      uvicorn classifier_runner:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 100s
      timeout: 3s
      retries: 30
      start_period: 20s
    environment:
      <<: *minio-env
      AI_BASE_URL: "http://ollama:11434"
      AI_MODEL: "qwen2.5:3b-instruct"   # or whatever LocalAI exposes
      AI_API_KEY: "secret"
    env_file:
      - ${ENV_FILE:-.env}
  minio:
    logging: *default-logging
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-clankr}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio_init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-clankr}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me}
      MINIO_BUCKET: ${MINIO_BUCKET:-clankr-audio}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET
    restart: "no"

  ollama:
    logging: *default-logging
    image: ollama/ollama:latest
    # Platform is intentionally unspecified so this works on Linode x86_64 and ARM hosts.
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ./ollama:/root/.ollama
    restart: unless-stopped

  # one-shot init to pull the model on first boot
  # ollama-init:
  #   image: curlimages/curl:8.7.1
  #   depends_on:
  #     - ollama
  #   command: >
  #     sh -lc '
  #     until curl -s http://ollama:11434/api/version; do sleep 1; done &&
  #     curl -sS http://ollama:11434/api/pull
  #     -d "{\"model\":\"qwen2.5:3b-instruct\"}" && echo "pulled"
  #     '
  #   restart: "no"



  acousti_api:
    logging: *default-logging
    build: ./acousti-api
    restart: on-failure
    volumes:
      - ./acousti-api:/app
    environment: *minio-env
    depends_on:
      minio_init:
        condition: service_completed_successfully
    command: >
      uvicorn acousti_runner:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app
    working_dir: /app
    env_file:
      - ${ENV_FILE:-.env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 100s
      timeout: 3s
      retries: 30
      start_period: 20s
  orchestrator_api:
    logging: *default-logging
    build: ./orchestrator-api
    depends_on:
      minio_init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      demucs_api:
        condition: service_healthy
      whisper_api:
        condition: service_healthy
      classifier_api:
        condition: service_healthy
      acousti_api:
        condition: service_healthy
    volumes:
      - ./orchestrator-api:/app
    environment: *minio-env
    working_dir: /app
    command: >
      uvicorn orchestrator_runner:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app
    env_file:
      - ${ENV_FILE:-.env}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 100s
      timeout: 3s
      retries: 30
      start_period: 20s
volumes:
  pgdata:
  miniodata:
