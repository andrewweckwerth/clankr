name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tests/backend/requirements.txt
            services/orchestrator/requirements.txt
            services/classifier/requirements.txt
            services/acousti/requirements.txt
      - run: python -m pip install -r tests/backend/requirements.txt
      - run: python -m pytest -m 'not integration' -q --junitxml=test-results/backend-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend-integration:
    name: Backend PostgreSQL and Redis tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clankr_test
          POSTGRES_PASSWORD: clankr_test
          POSTGRES_DB: clankr_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clankr_test -d clankr_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://clankr_test:clankr_test@127.0.0.1:5432/clankr_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tests/backend/requirements.txt
            services/orchestrator/requirements.txt
            services/classifier/requirements.txt
            services/acousti/requirements.txt
      - run: python -m pip install -r tests/backend/requirements.txt
      - run: python -m pytest --integration -m integration -q --junitxml=test-results/backend-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-integration-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend components and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETTER_AUTH_SECRET: test-only-auth-secret-for-browser-suite
      BETTER_AUTH_URL: http://127.0.0.1:3100
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser-results
          path: |
            services/frontend/playwright-report/
            services/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
