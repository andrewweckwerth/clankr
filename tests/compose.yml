# Disposable services used only by the backend integration suite.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: clankr_test
      POSTGRES_PASSWORD: clankr_test
      POSTGRES_DB: clankr_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clankr_test -d clankr_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
